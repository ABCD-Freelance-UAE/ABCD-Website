<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ABCD Freelance LLC-FZ</title>
<style>
:root{
  --bg:#e3f1ee;
  --fg:#17221f;
  --muted:#5f6d69;
  --accent:#c4861c;
  --btn-fg:#f6f4f0;
  --line:rgba(21,34,32,0.13);
  --ink-bg:#1c1814;
  --ink-fg:#f5f1e9;
  --ink-muted:#b8b0a2;
  --copper:#e3a23f;
  --copper-fg:#1c1814;
  --display:'Source Serif 4',Georgia,'Times New Roman',serif;
  --body:'Inter',system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1a18;
    --fg:#e8f3f0;
    --muted:#8fa39e;
    --accent:#e3a23f;
    --btn-fg:#0d1a18;
    --line:rgba(232,243,240,0.14);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1a18;
  --fg:#e8f3f0;
  --muted:#8fa39e;
  --accent:#e3a23f;
  --btn-fg:#0d1a18;
  --line:rgba(232,243,240,0.14);
  color-scheme:dark;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  background:var(--ink-bg);
  color:var(--ink-fg);
  font-family:var(--body);
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  min-height:100dvh;
  display:flex;
  flex-direction:column;
}
a{color:inherit;}

.wrap{
  max-width:720px;
  margin:0 auto;
  width:100%;
  padding-left:max(20px, env(safe-area-inset-left,0px));
  padding-right:max(20px, env(safe-area-inset-right,0px));
}

main{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding-block:48px;
}
main .wrap{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:14px;
}
.name{
  font-family:var(--display);
  font-weight:600;
  font-size:clamp(24px,5vw,34px);
  letter-spacing:-0.01em;
}
.location{
  font-size:13px;
  letter-spacing:0.04em;
  text-transform:uppercase;
  color:var(--ink-muted);
}
.status{
  margin-top:18px;
  font-size:16.5px;
  color:var(--ink-muted);
}
.contact{
  margin-top:26px;
  font-size:15px;
}
.contact a{
  text-decoration:none;
  color:var(--copper);
  border-bottom:1px solid rgba(227,162,63,0.4);
  padding-bottom:2px;
}
.contact a:hover{border-color:var(--copper);}

footer.site{border-top:1px solid rgba(245,241,233,0.14);padding-block:22px;}
footer.site .wrap{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:14px;
  flex-wrap:wrap;
  font-size:12px;
  color:var(--ink-muted);
}
footer.site a{text-decoration:none;color:var(--ink-muted);border-bottom:1px solid transparent;padding-bottom:1px;transition:color .15s ease,border-color .15s ease;}
footer.site a:hover{color:var(--ink-fg);border-color:var(--copper);}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

<main>
  <div class="wrap">
    <div class="name">ABCD Freelance LLC&#8209;FZ</div>
    <div class="location">Dubai, UAE</div>
    <p class="status">Website coming soon.</p>
    <p class="contact"><a href="mailto:abcdfreelanceuae@gmail.com">abcdfreelanceuae@gmail.com</a></p>
  </div>
</main>

<footer class="site">
  <div class="wrap">
    <span>&copy; ABCD Freelance LLC&#8209;FZ — Dubai, UAE</span>
    <a href="privacy.html">Privacy Policy</a>
  </div>
</footer>

</body>
</html>
